services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finsight
      POSTGRES_USER: finsight
      POSTGRES_PASSWORD: finsight
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  backend:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/finsight
      DB_USERNAME: finsight
      DB_PASSWORD: finsight
      JWT_SECRET: change-this-production-secret-to-a-long-random-value
    ports: ["8080:8080"]
    depends_on: [postgres]
  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [backend]
volumes: {pgdata: {}}
