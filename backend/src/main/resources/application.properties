spring.application.name=finsight-ai
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/finsight;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
management.endpoints.web.exposure.include=health,info,metrics
app.jwt.secret=${JWT_SECRET:change-this-demo-secret-key-at-least-32-characters-long}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}
